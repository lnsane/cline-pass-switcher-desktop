<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src http://127.0.0.1:* http://localhost:*;">
<title>Cline Pass Switcher</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 顶部：无边框窗口的自绘标题栏（native 最小化/最大化/关闭按钮由 titleBarOverlay 提供） -->
<header class="titlebar" id="titlebar">
  <div class="tb-left">
    <div class="brand">
      <img class="brand-mark" id="brandMark" alt="" width="18" height="18">
      <span class="brand-name">Cline Pass Switcher</span>
      <span class="brand-ver" id="brandVer" title="当前运行版本"></span>
    </div>
  </div>
  <div class="tb-center">
    <div class="conn" id="connPill" title="引擎状态">
      <span class="dot" id="connDot"></span>
      <span id="connText">启动中…</span>
      <button class="conn-copy" id="btnCopyBase" title="复制代理地址">
        <span id="connBase">—</span>
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6 2h6a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 12 11H6a1.5 1.5 0 0 1-1.5-1.5v-6A1.5 1.5 0 0 1 6 2Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 5.5v6A1.5 1.5 0 0 0 5 13h6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </div>
  <div class="tb-right">
    <button class="tb-btn" id="btnLogs" title="运行日志">日志</button>
  </div>
</header>

<div class="shell">
  <!-- 侧边导航 -->
  <nav class="sidebar" id="sidebar">
    <button class="nav-item" data-view="overview">
      <span class="nav-ico">◧</span><span>概览</span>
    </button>
    <button class="nav-item" data-view="accounts">
      <span class="nav-ico">◉</span><span>账号池</span>
    </button>
    <button class="nav-item" data-view="models">
      <span class="nav-ico">⇅</span><span>订阅模型</span>
    </button>
    <button class="nav-item" data-view="playground">
      <span class="nav-ico">▷</span><span>测试台</span>
    </button>
    <button class="nav-item" data-view="usage">
      <span class="nav-ico">▦</span><span>用量统计</span>
    </button>
    <button class="nav-item" data-view="history">
      <span class="nav-ico">≡</span><span>请求历史</span>
    </button>
    <button class="nav-item" data-view="catalog">
      <span class="nav-ico">☰</span><span>完整目录</span>
    </button>
    <button class="nav-item" data-view="settings">
      <span class="nav-ico">⚙</span><span>设置</span>
    </button>
  </nav>

  <!-- 主内容 -->
  <main class="content" id="content">
    <div class="view-head">
      <div>
        <h1 id="viewTitle">概览</h1>
        <p class="view-sub" id="viewSub"></p>
      </div>
      <div class="view-actions" id="viewActions"></div>
    </div>
    <div id="view" class="view-body"></div>
  </main>
</div>

<!-- 日志抽屉 -->
<aside class="drawer" id="logDrawer" hidden>
  <div class="drawer-head">
    <strong>运行日志</strong>
    <div class="row-gap">
      <button class="btn btn-ghost btn-sm" id="btnClearLogs">清空</button>
      <button class="btn btn-ghost btn-sm" id="btnCloseLogs">关闭</button>
    </div>
  </div>
  <div class="log-list" id="logList"></div>
</aside>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-wrap" id="modalWrap" hidden></div>

<script src="js/util.js"></script>
<script src="js/locale-en.js"></script>
<script src="js/locale-patterns.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/ccswitch.js"></script>
<script src="js/claudeconfig.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/accounts.js"></script>
<script src="js/views/models.js"></script>
<script src="js/views/playground.js"></script>
<script src="js/views/usage.js"></script>
<script src="js/views/history.js"></script>
<script src="js/views/catalog.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
